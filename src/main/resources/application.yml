server:
  port: 8761
spring:
  application:
    name: eureka-server
  cloud:
    config:
      enabled: false
  security:
    user:
      name: ${EUREKA_USER:admin}
      password: ${EUREKA_PASSWORD:admin}
  config:
    import: optional:classpath:config/platform-defaults.yml
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: false
  client:
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:true}
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    expected-client-renewal-interval-seconds: 15
    peer-node-read-timeout-ms: 8000
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
logging:
  file:
    name: logs/${spring.application.name}.log
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] [%t] %logger{36} - %msg%n'
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
